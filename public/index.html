<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: Arial, sans-serif; background:#f0f0f0; text-align:center; padding:20px; }
        .busca { margin-bottom:20px; }
        input { padding:8px; width:200px; }
        button { padding:8px; }
        .card { background:#fff; border-radius:8px; display:inline-block; padding:20px; margin-top:20px; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
        .tipos span { display:inline-block; padding:4px 8px; margin:2px; border-radius:4px; background:#ddd; }
        .info-grid { display:flex; justify-content:center; margin-top:10px; }
        .info-item { margin:0 10px; }
        .erro { color:red; font-weight:bold; }
        .carregando { font-style:italic; }
    </style>
</head>
<body>
    <h1>Pokedex</h1>
    <p class='subtitulo'>Digite o nome de um Pokémon para pesquisar</p>

    <div class="busca">
        <input type='text' id='inputPokemon' placeholder='Ex: pikachu, bulbasaur...' 
               onkeydown="if(event.key==='Enter') buscar()" />
        <button onclick='buscar()'>Buscar</button>
    </div>

    <div id='resultado'></div>

    <script>
    async function buscar() {
        const nome = document.getElementById('inputPokemon').value.trim();
        const div  = document.getElementById('resultado');

        if (!nome) {
            div.innerHTML = '<div class="erro">Digite o nome</div>';
            return;
        }

        div.innerHTML = '<div class="carregando">Buscando...</div>';

        try {
            const resposta = await fetch(`/api/pokemon/${nome}`);
            const dados = await resposta.json();

            if (!resposta.ok) {
                div.innerHTML = `<div class="erro">${dados.erro}</div>`;
                return;
            }

            const tiposHTML = (dados.tiposHTML || [])
                .map(t => `<span class="tipo ${t}">${t}</span>`)
                .join('');

            div.innerHTML = `
            <div class='card'>
                <img src='${dados.imagem}' alt='Imagem de ${dados.home}' width="200" />
                <h2>${dados.home}</h2>
                <p class='numero'>#${String(dados.id).padStart(3,'0')}</p>
                <div class='tipos'>${tiposHTML}</div>
                <div class='info-grid'>
                   <div class='info-item'>
                    <div class='label'>Altura</div>
                    <div class='value'>${dados.altura}</div>
                   </div>
                   <div class='info-item'>
                    <div class='label'>Peso</div>
                    <div class='value'>${dados.peso}</div>
                   </div>
                </div>
                <div class='habilidades'>
                    <strong>Habilidades:</strong>
                    ${dados.habilidades.join(', ')}
                </div>
            </div>`;
        } catch (e) {
            div.innerHTML = '<div class="erro">Erro ao conectar com o servidor.</div>';
        }
    }
    </script>
</body>
</html>
